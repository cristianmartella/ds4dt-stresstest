services:
  profiler:
    container_name: spvs-profiler
    build:
      context: .
      dockerfile: Dockerfile.profiler
    env_file:
      - ./src/resources/conf.fdsc.env
      - ./src/resources/api_keys.env
    volumes:
      - profiler-data:/app
      - ./wallet-identity:/app/resources/wallet-identity
      - ./scripts:/app/scripts
    network_mode: host
    ulimits:
      nofile:
        soft: 1048576
        hard: 1048576
    deploy:
      resources:
        reservations:
          cpus: '2'
          memory: 8G

volumes:
  profiler-data: